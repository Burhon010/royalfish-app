<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оптовый заказ — Royal Fish</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/logo-circle-480.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="partner.css" />
  </head>
  <body class="print-body">
    <div class="print-toolbar">
      <button type="button" class="p-btn" id="printBtn">Распечатать</button>
      <button type="button" class="p-btn p-btn--ghost" id="pdfBtn">Скачать PDF</button>
      <button type="button" class="p-btn p-btn--ghost" id="closeBtn">Закрыть</button>
      <p class="p-note" id="pdfHint">Чтобы сохранить PDF: в окне печати выберите принтер «Сохранить как PDF» (формат A4).</p>
    </div>

    <div class="print-sheet" id="sheet">
      <p class="p-empty">Загружаем…</p>
    </div>

    <script src="print-order.js"></script>
  </body>
</html>
